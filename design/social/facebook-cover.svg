  <text x="851" y="284" text-anchor="middle" fill="#ecc98a" font-family="Great Vibes, Georgia, serif" font-size="76">Khoảng Ngẫm</text>
  <text x="851" y="376" text-anchor="middle" fill="#f7f0e2" font-family="Source Serif 4, Georgia, serif" font-size="73" font-weight="500">99 ngày thương mình</text>
  <path d="M654 409H751M951 409H1048" stroke="#ecc98a" stroke-width="1.5" opacity=".62"/>
  <path d="M851 404l5 5-5 5-5-5z" fill="#ecc98a" opacity=".8"/>

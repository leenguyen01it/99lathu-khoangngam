    <path d="M-4.8 1.5A4.8 4.8 0 0 1 4.8 1.5M-8.4 1.5H8.4" stroke="#c79f58" stroke-width=".6"/>
    <path d="M-5.8 4H5.8M-3.2 6.2H3.2" stroke="#73927f" stroke-width=".55"/>
  </g>

  <text x="45.8" y="23.1" text-anchor="middle" fill="#16302f"
        font-family="'Source Serif 4', Georgia, serif" font-size="3.5" font-weight="400">Lá thư hôm nay đang chờ bạn</text>

  <!-- CÁCH 1: chạm điện thoại vào thẻ -->
  <g transform="translate(27 35.5)">
    <circle r="6" fill="#16302f"/>
    <g fill="none" stroke="#f7f0e2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-2.5" y="-4.1" width="5" height="8.2" rx=".85" stroke-width=".45"/>
      <path d="M-1 2.9H1" stroke-width=".4"/>

    <radialGradient id="paper" cx="50%" cy="42%" r="72%">
      <stop stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f0e5d1"/>
    </radialGradient>
  </defs>

  <rect width="91.6" height="60" fill="url(#paper)"/>

  <!-- EMBLEM: bản rút gọn, không tia nắng -->

<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Khoảng Ngẫm, thiết kế thẻ NFC</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e2422; color: #f7f0e2; font-family: Arial, sans-serif; }
    main { width: min(1120px, 94vw); padding: 48px 0 60px; }
    h1 { margin: 0 0 8px; font: 600 28px Georgia, serif; text-align: center; }
    .note { margin: 0 0 34px; color: #bcd3bd; font-size: 14px; text-align: center; }
    .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 34px; }
    figure { margin: 0; }
    /* Khung nhìn = khổ thành phẩm 85.6 x 54, bo góc 3.18 mm. SVG 91.6 x 60 được đẩy lệch 3 mm để cắt bỏ bleed. */
    .card { position: relative; overflow: hidden; aspect-ratio: 85.6 / 54; border-radius: 3.715% / 5.889%; box-shadow: 0 24px 60px rgb(0 0 0 / .38); }
    /* Dùng <object> thay <img> để SVG tải được font trong fonts/. */
    .card object { position: absolute; left: -3.505%; top: -5.556%; width: 107.009%; height: 111.111%; pointer-events: none; }
    figcaption { margin-top: 13px; color: #bcd3bd; font-size: 13px; letter-spacing: .08em; text-align: center; text-transform: uppercase; }
    h2 { margin: 52px 0 6px; font: 600 19px Arial, sans-serif; text-align: center; }
    /* Bản kiểm tra: hiển thị cả vùng bleed 91.6 x 60 kèm lớp guides của SVG. */
    .card.full { aspect-ratio: 91.6 / 60; border-radius: 0; box-shadow: none; outline: 1px solid rgb(247 240 226 / .35); }
    .card.full object { left: 0; top: 0; width: 100%; height: 100%; }
    .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 22px; margin: 0 0 22px; padding: 0; list-style: none; color: #bcd3bd; font-size: 13px; }
    .legend i { display: inline-block; width: 14px; height: 10px; margin-right: 7px; vertical-align: -1px; }
    @media (max-width: 760px) { .cards { grid-template-columns: 1fr; } main { padding-top: 28px; } }
  </style>
</head>
<body>
  <main>
    <h1>Thẻ NFC | 99 ngày thương mình</h1>
    <p class="note">Hiển thị đúng khổ thành phẩm 85,6 × 54 mm (đã cắt bleed 3 mm)</p>
    <div class="cards">
      <figure><div class="card"><object type="image/svg+xml" data="front.svg" aria-label="Mặt trước"></object></div><figcaption>Mặt trước</figcaption></figure>
      <figure><div class="card"><object type="image/svg+xml" data="back.svg" aria-label="Mặt sau"></object></div><figcaption>Mặt sau</figcaption></figure>
    </div>

    <h2>Bản kiểm tra bleed và đường cắt</h2>
    <p class="note">Toàn bộ file in 91,6 × 60 mm</p>
    <ul class="legend">
      <li><i style="background: rgb(255 45 149 / .45)"></i>Bleed 3 mm, phần bị cắt bỏ</li>
      <li><i style="border: 2px solid #ff2d95"></i>Đường cắt 85,6 × 54 mm</li>
      <li><i style="border: 2px dashed #00a8e8"></i>Vùng an toàn, cách đường cắt 4 mm</li>
    </ul>
    <div class="cards">
      <figure><div class="card full"><object type="image/svg+xml" data="front.svg#guides" aria-label="Mặt trước kèm đường cắt"></object></div><figcaption>Mặt trước</figcaption></figure>
      <figure><div class="card full"><object type="image/svg+xml" data="back.svg#guides" aria-label="Mặt sau kèm đường cắt"></object></div><figcaption>Mặt sau</figcaption></figure>
    </div>
  </main>
</body>
</html>

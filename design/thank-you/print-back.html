<!doctype html><html lang="vi"><meta charset="utf-8"><title>Thiệp cảm ơn — Khoảng Ngẫm</title><style>@font-face{font-family:'Source Serif 4';src:url('../nfc-card/fonts/source-serif-4-regular.ttf')}@font-face{font-family:'Source Serif 4';font-style:italic;src:url(../nfc-card/fonts/source-serif-4-italic.ttf)}@font-face{font-family:Script;src:url('../nfc-card/fonts/wordmark/greatvibes.ttf')}*{box-sizing:border-box}body{margin:0} @page{size:96mm 60mm;margin:0}.card{width:96mm;height:60mm;position:relative;overflow:hidden;break-after:page;font-family:'Source Serif 4',Georgia,serif;text-align:center}.card:last-child{break-after:auto}.front{background:#16302f;color:#f7f0e2;padding:10mm 8mm}.back{background:#f7f0e2;color:#16302f;padding:8mm 9mm}.back p{font-size:9pt;line-height:1.5}.back .rule{margin:2.5mm auto}.back h2{font-size:12pt;margin-bottom:2mm}.back .signature{font-size:12pt;margin-top:1.5mm}.brand{font-family:Script;font-size:17pt;margin:0}.front .brand{color:#ecc98a}.emblem{width:19mm;height:10mm;margin:3mm auto 1mm;display:block}h1{font-size:22pt;font-weight:400;margin:0 0 2mm}p{font-size:9pt;line-height:1.6;margin:0}h2{font-size:14pt;font-weight:400;margin:0 0 3mm}.small{font-size:8pt}.rule{width:12mm;border:0;border-top:.25mm solid #b69a63;margin:2mm auto}.signature{font-family:Script;font-size:14pt;margin-top:2mm}.back{text-align:left;padding:0 9mm;display:flex;align-items:center}.letter{width:100%}.back p{font-size:8.5pt;line-height:1.6;white-space:nowrap}.back p+p{margin-top:4mm}.back .quote{font-style:italic;color:#8c6f40}.back .signature{font-size:15pt;margin-top:4mm}</style><body><section class="card back"><div class="letter"><p class="quote">Có những ngày, một câu nói đúng lúc<br>cũng đủ để mình đi tiếp.</p><p>Chúc bạn mỗi ngày có một khoảng nhỏ<br>để đọc một lá thư và dịu dàng hơn với chính mình.</p><p>Đọc vài lá rồi, nếu thấy thương tấm thẻ này,<br>bạn để lại cho chúng mình đôi dòng đánh giá nhé.</p></div></section></body></html>
